<div class="auth-page">
  <div class="auth-carte">
    <h2>Créer un compte</h2>

    <form (ngSubmit)="sInscrire()">
      <div class="champ">
        <label for="nomComplet">Nom complet</label>
        <input id="nomComplet" name="nomComplet" type="text" [(ngModel)]="nomComplet" required placeholder="Votre nom">
      </div>

      <div class="champ">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="vous@exemple.com">
      </div>

      <div class="champ">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" name="motDePasse" type="password" [(ngModel)]="motDePasse" required minlength="6">
      </div>

      <button type="submit" [disabled]="enregistrement">
        {{ enregistrement ? 'Création...' : 'Créer le compte' }}
      </button>
    </form>

    <p *ngIf="erreur" class="message-erreur">{{ erreur }}</p>

    <div class="auth-liens">
      <a routerLink="/connexion">Déjà un compte ? Se connecter</a>
    </div>
  </div>
</div>
