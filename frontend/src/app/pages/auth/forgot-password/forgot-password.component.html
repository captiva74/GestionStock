<div class="auth-page">
  <div class="auth-carte">
    <h2>Mot de passe oublié</h2>

    <form (ngSubmit)="envoyer()">
      <div class="champ">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="vous@exemple.com">
      </div>

      <button type="submit" [disabled]="enregistrement">
        {{ enregistrement ? 'Envoi...' : 'Envoyer le lien de réinitialisation' }}
      </button>
    </form>

    <p *ngIf="message" class="message-succes">{{ message }}</p>
    <p *ngIf="erreur" class="message-erreur">{{ erreur }}</p>

    <div class="auth-liens">
      <a routerLink="/connexion">Retour à la connexion</a>
    </div>
  </div>
</div>
