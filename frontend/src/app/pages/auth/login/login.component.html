<div class="auth-page">
  <div class="auth-carte">
    <h2>Connexion</h2>

    <form (ngSubmit)="seConnecter()">
      <div class="champ">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="vous@exemple.com">
      </div>

      <div class="champ">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" name="motDePasse" type="password" [(ngModel)]="motDePasse" required>
      </div>

      <button type="submit" [disabled]="enregistrement">
        {{ enregistrement ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p *ngIf="erreur" class="message-erreur">{{ erreur }}</p>

    <div class="auth-liens">
      <a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a>
      <a routerLink="/inscription">Créer un compte</a>
    </div>
  </div>
</div>
