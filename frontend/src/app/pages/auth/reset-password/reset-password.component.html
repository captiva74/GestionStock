<div class="auth-page">
  <div class="auth-carte">
    <h2>Réinitialiser le mot de passe</h2>

    <p *ngIf="lienInvalide" class="message-erreur">
      Lien de réinitialisation invalide. Vérifiez le lien reçu par email.
    </p>

    <form (ngSubmit)="reinitialiser()" *ngIf="!lienInvalide">
      <div class="champ">
        <label for="nouveauMotDePasse">Nouveau mot de passe</label>
        <input id="nouveauMotDePasse" name="nouveauMotDePasse" type="password" [(ngModel)]="nouveauMotDePasse" required minlength="6">
      </div>

      <div class="champ">
        <label for="confirmation">Confirmer le mot de passe</label>
        <input id="confirmation" name="confirmation" type="password" [(ngModel)]="confirmation" required>
      </div>

      <button type="submit" [disabled]="enregistrement">
        {{ enregistrement ? 'Enregistrement...' : 'Réinitialiser' }}
      </button>
    </form>

    <p *ngIf="message" class="message-succes">{{ message }}</p>
    <p *ngIf="erreur" class="message-erreur">{{ erreur }}</p>

    <div class="auth-liens">
      <a routerLink="/connexion">Retour à la connexion</a>
    </div>
  </div>
</div>
