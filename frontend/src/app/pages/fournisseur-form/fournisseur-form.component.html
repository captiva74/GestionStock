
<div class="fournisseur-form-page">
  <div class="entete-page">
    <div>
      <h2>{{ modeModification ? 'Modifier un fournisseur' : 'Ajouter un fournisseur' }}</h2>
      <p>
        {{ modeModification
          ? 'Modifiez les informations du fournisseur.'
          : 'Renseignez les informations du nouveau fournisseur.' }}
      </p>
    </div>

    <a routerLink="/fournisseurs/liste" class="btn-retour">
      ← Retour à la liste
    </a>
  </div>

  <div class="carte-formulaire">
    <div *ngIf="chargement" class="info">
      Chargement du fournisseur...
    </div>

    <div *ngIf="erreur" class="message-erreur" role="alert">
      {{ erreur }}
    </div>

    <form
      *ngIf="!chargement"
      #fournisseurForm="ngForm"
      (ngSubmit)="enregistrer()"
    >
      <div class="grille-formulaire">
        <div class="champ">
          <label for="nom">Nom *</label>
          <input
            id="nom"
            name="nom"
            type="text"
            [(ngModel)]="formulaire.nom"
            required
            maxlength="100"
            placeholder="Nom du fournisseur"
          />
        </div>

        <div class="champ">
          <label for="prenom">Prénom *</label>
          <input
            id="prenom"
            name="prenom"
            type="text"
            [(ngModel)]="formulaire.prenom"
            required
            maxlength="100"
            placeholder="Prénom du fournisseur"
          />
        </div>

        <div class="champ champ-large">
          <label for="activite">Activité *</label>
          <input
            id="activite"
            name="activite"
            type="text"
            [(ngModel)]="formulaire.activite"
            required
            maxlength="200"
            placeholder="Ex. : Fournitures de bureau"
          />
        </div>

        <div class="champ champ-large">
          <label for="adresse">Adresse</label>
          <textarea
            id="adresse"
            name="adresse"
            [(ngModel)]="formulaire.adresse"
            maxlength="300"
            rows="3"
            placeholder="Adresse du fournisseur"
          ></textarea>
        </div>

        <div class="champ">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="formulaire.email"
            maxlength="254"
            email
            placeholder="exemple@domaine.dz"
          />
        </div>

        <div class="champ">
          <label for="telephone">Numéro de téléphone</label>
          <input
            id="telephone"
            name="numTelephone"
            type="tel"
            [(ngModel)]="formulaire.numTelephone"
            maxlength="30"
            placeholder="Numéro de téléphone"
          />
        </div>
      </div>

      <p class="champs-obligatoires">* Champs obligatoires</p>

      <div class="actions-formulaire">
        <a routerLink="/fournisseurs/liste" class="btn-annuler">
          Annuler
        </a>

        <button
          type="submit"
          class="btn-enregistrer"
          [disabled]="enregistrement || fournisseurForm.invalid"
        >
          {{
            enregistrement
              ? 'Enregistrement...'
              : modeModification
                ? 'Enregistrer les modifications'
                : 'Ajouter le fournisseur'
          }}
        </button>
      </div>
    </form>
  </div>
</div>
